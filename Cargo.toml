[package]
name = "kasm"
version = "2.0.3"
authors = ["Luke Newcomb <newcomb.luke@protonmail.com>"]
edition = "2021"
license = "GPL-3.0"
description = "The Kerbal Compiler Collection assembler for kOS"
readme = "README.md"
homepage = "https://github.com/newcomb-luke/kOS-KASM"

[dependencies]
atty = "0.2.14"
clap = { version = "4.5.11", features = ["derive"] }
kerbalobjects = "4.0.3"
logos = "0.14.0"
termcolor = "1.4"
pathdiff = "0.2.1"

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
